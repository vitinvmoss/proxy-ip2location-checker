<!doctype html><html><meta name=viewport content="width=device-width,initial-scale=1"><title>Login</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:24px;border-radius:16px;width:min(360px,calc(100% - 50px));box-shadow:0 5px 25px rgba(0,0,0,.08)}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #d1d5db;margin-top:10px}button{background:#111827;color:white;border:0;font-weight:700}.err{color:#b91c1c;font-size:13px;margin-top:8px}</style><body><div class=box><h2>Proxy Checker</h2><form method=post action=/login><input type=password name=password autocomplete=current-password autofocus required><button>Sign in</button></form>{% if error %}<div class=err>{{error}}</div>{% endif %}</div></body></html>
