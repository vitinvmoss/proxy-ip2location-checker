<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy Checker Login</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;min-height:100vh;display:grid;place-items:center}
.card{background:white;padding:24px;border-radius:16px;width:min(360px,calc(100% - 40px));box-shadow:0 5px 25px #0001}
input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:10px}
button{background:#111827;color:#fff;border:0;font-weight:700}.error{color:#b91c1c;font-size:14px}
</style></head>
<body><div class="card"><h2>Proxy Checker</h2><p>Private access</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><input type="password" name="password" placeholder="Password" autofocus required><button>Sign in</button></form>
</div></body></html>
