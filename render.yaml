services:
  - type: web
    name: proxy-ip2location-checker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: IP2LOCATION_API_KEY
        sync: false
